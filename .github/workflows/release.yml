# 主分支构建发布
name: build-app
on:
    push:
        branches:
            - next

jobs:
    # ========================= 准备项目 =========================
    init:
        name: 初始化构建
        runs-on: ubuntu-latest
        outputs:
            version: ${{ steps.step_init.outputs.VERSION }}
        steps:
            # 拉取代码
            - name: Checkout
              uses: actions/checkout@v4
              with:
                  submodules: recursive
            # 初始化一些流程需要的环境变量
            - name: Init Env
              id: step_init
              run: echo VERSION=$(node -p "require('./package.json').version") >> $GITHUB_OUTPUT

    # ========================= 构建 Web 版本 =========================
    build-root-web:
        needs: init
        uses: ./.github/workflows/build-web.yml
        with:
            version: ${{ needs.init.outputs.version }}

    # ========================= 构建 Electron 版本 =========================
    build-electron:
        needs: init
        uses: ./.github/workflows/build-electron.yml
        with:
            version: ${{ needs.init.outputs.version }}

    # ========================= 构建 Tauri 版本 =========================
    build-tauri:
        needs: init
        uses: ./.github/workflows/build-tauri.yml
        with:
            version: ${{ needs.init.outputs.version }}

    # ========================= 构建 Android 版本 =========================
    build-android:
        needs: init
        uses: ./.github/workflows/build-android.yml
        with:
            version: ${{ needs.init.outputs.version }}
        secrets:
            KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
            KEYSTORE_ALIAS_PASSWORD: ${{ secrets.KEYSTORE_ALIAS_PASSWORD }}

    # ========================= 构建 iOS 版本 =========================
    build-ios:
        needs: init
        uses: ./.github/workflows/build-ios.yml
        with:
            version: ${{ needs.init.outputs.version }}

    # ========================= 发布构建结果 =========================
    release:
        name: 发布构建结果
        runs-on: ubuntu-latest
        if: always()
        needs:
            - init
            - build-root-web
            - build-electron
            - build-tauri
            - build-android
            - build-ios
        steps:
            # 只有在 init 成功时才执行发布
            - name: Check Init Success
              if: needs.init.result != 'success'
              run: exit 1
            # 下载构建结果
            - name: Download Artifacts
              id: download-artifact
              uses: actions/download-artifact@v4
              continue-on-error: true
              with:
                  path: artifacts
                  pattern: ${{ needs.init.outputs.version }}-*
                  merge-multiple: true
            - name: Artifacts List
              run: ls -R artifacts
            # 发布构建结果
            - name: Publish Release
              uses: softprops/action-gh-release@a06a81a03ee405af7f2048a818ed3f03bbf83c7b
              with:
                  files: artifacts/**/*
                  tag_name: v${{ needs.init.outputs.version }}
                  body: |
                      # Release 自动构建
                      `这是一个自动构建版本，由 GitHub Actions 自动构建并发布。`
                      ## 更新内容
                      ${{ github.event.head_commit.message }}
                      ## 自动构建信息
                      - 构建时间：${{ github.event.head_commit.timestamp }}
                      - 构建提交：${{ github.event.head_commit.id }}
                      - 构建分支：${{ github.event.head_commit.tree_id }}
                  draft: false
                  prerelease: false
                  token: ${{ secrets.ACCESS_TOKEN }}
