name: 构建 Android

on:
    workflow_call:
        inputs:
            version:
                description: "应用版本"
                required: true
                type: string
        secrets:
            KEYSTORE_PASSWORD:
                required: false
            KEYSTORE_ALIAS_PASSWORD:
                required: false

jobs:
    build:
        runs-on: ubuntu-latest

        steps:
            - name: 拉取代码
              uses: actions/checkout@v4
              with:
                  submodules: recursive
            
            - name: 设置 Java 17
              uses: actions/setup-java@v4
              with:
                  distribution: 'temurin'
                  java-version: '17'
            
            - name: 启用 Corepack
              run: corepack enable
            
            - name: 设置 Nodejs
              uses: actions/setup-node@v4
              with:
                  node-version: 20.x
                  cache: 'yarn'
            
            - name: 更新依赖
              run: yarn
            
            - name: 构建 Android 应用
              run: yarn build:android
              env:
                  KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
                  KEYSTORE_ALIAS_PASSWORD: ${{ secrets.KEYSTORE_ALIAS_PASSWORD }}

            - name: 准备产物
              run: |
                  mkdir -p upload
                  cp src/mobile/android/app/build/outputs/apk/release/*.apk upload/ || true
                  cp src/mobile/android/app/build/outputs/bundle/release/*.aab upload/ || true

            - name: 上传构建产物
              uses: actions/upload-artifact@v4
              with:
                  name: ${{ inputs.version }}-android
                  path: upload/
