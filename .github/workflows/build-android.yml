name: 构建 Android

on:
    workflow_call:
        inputs:
            version:
                description: "应用版本"
                required: true
                type: string
            git_hash:
                description: "Git 哈希"
                required: true
                type: string
        secrets:
            KEYSTORE_PASSWORD:
                required: true
            KEYSTORE_ALIAS_PASSWORD:
                required: true

jobs:
    build:
        runs-on: ubuntu-latest

        steps:
            - name: 拉取代码
              uses: actions/checkout@v4
              with:
                  submodules: recursive
            
            - name: 设置 Java 17
              uses: actions/setup-java@v4
              with:
                  distribution: 'temurin'
                  java-version: '17'
            
            - name: 设置 Gradle 缓存
              uses: gradle/actions/setup-gradle@v4
              with:
                gradle-version: wrapper
                build-root-directory: src/mobile/android
            
            - name: 启用 Corepack
              run: corepack enable
            
            - name: 设置 Nodejs
              uses: actions/setup-node@v4
              with:
                  node-version: 20.x
                  cache: 'yarn'
            
            - name: 更新依赖
              run: yarn install --immutable
            
            - name: 构建 Android 应用（Gradle Release）
              run: |
                set -euo pipefail
                # 1. 构建前端并同步到 Android 工程
                yarn build
                yarn capacitor sync android
                
                # 2. 使用 Gradle 直接生成 release 产物
                chmod +x src/mobile/android/gradlew
                
                # 增加重试逻辑，防止仓库网络抖动导致依赖下载失败
                for i in 1 2 3; do
                  if (cd src/mobile/android && ./gradlew --no-daemon assembleRelease bundleRelease); then
                    break
                  fi
                  if [ "$i" -eq 3 ]; then
                    echo "Gradle build failed after 3 attempts"
                    exit 1
                  fi
                  echo "Gradle 构建失败，10 秒后重试（$i/3）..."
                  sleep 10
                done
              env:
                  ANDROID_KEYSTORE_PATH: ${{ github.workspace }}/src/mobile/_signing/stapxs_qq.keystore
                  ANDROID_KEY_ALIAS: stapxs_qq_key
                  ANDROID_KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
                  ANDROID_KEY_PASSWORD: ${{ secrets.KEYSTORE_ALIAS_PASSWORD }}
            
            - name: 准备产物
              run: |
                  set -euo pipefail
                  mkdir -p upload
                  VERSION=${{ inputs.version }}
                  APK_PATH="src/mobile/android/app/build/outputs/apk/release/app-release.apk"
                  if [ ! -f "$APK_PATH" ]; then
                    echo "Signed APK not found: $APK_PATH"
                    ls -R src/mobile/android/app/build/outputs/apk/release || true
                    exit 1
                  fi
                  
                  cp "$APK_PATH" "upload/Stapxs-QQ-Lite-v${VERSION}-android.apk"
                  
                  AAB_PATH=$(find src/mobile/android/app/build/outputs/bundle/release -name "*.aab" | head -n 1)
                  if [ -n "$AAB_PATH" ] && [ -f "$AAB_PATH" ]; then
                    cp "$AAB_PATH" "upload/Stapxs-QQ-Lite-v${VERSION}-android.aab"
                  fi
            
            - name: 上传构建产物
              uses: actions/upload-artifact@v4
              with:
                  name: Stapxs-QQ-Lite-v${{ inputs.version }}-android
                  path: upload/
                  if-no-files-found: error
