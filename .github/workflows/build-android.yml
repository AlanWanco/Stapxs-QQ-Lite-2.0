name: 构建 Android

on:
    workflow_call:
        inputs:
            version:
                description: "应用版本"
                required: true
                type: string
        secrets:
            KEYSTORE_PASSWORD:
                required: true
            KEYSTORE_ALIAS_PASSWORD:
                required: true

jobs:
    build:
        runs-on: ubuntu-latest

        steps:
            - name: 拉取代码
              uses: actions/checkout@v4
              with:
                  submodules: recursive
            
            - name: 设置 Java 17
              uses: actions/setup-java@v4
              with:
                  distribution: 'temurin'
                  java-version: '17'
            
            - name: 启用 Corepack
              run: corepack enable
            
            - name: 设置 Nodejs
              uses: actions/setup-node@v4
              with:
                  node-version: 20.x
                  cache: 'yarn'
            
            - name: 更新依赖
              run: yarn
            
            - name: 构建 Android 应用
              run: |
                set -euo pipefail
                # 1. 构建未签名版本，增加重试以降低临时网络故障影响
                for i in 1 2 3; do
                  if yarn build:android; then
                    break
                  fi
                  if [ "$i" -eq 3 ]; then
                    echo "Android build failed after 3 attempts"
                    exit 1
                  fi
                  echo "构建失败，10 秒后重试（$i/3）..."
                  sleep 10
                done
              env:
                  # 这里不需要传密码，因为我们要手动签名
                  KEYSTORE_PASSWORD: ""
                  KEYSTORE_ALIAS_PASSWORD: ""

            - name: 优化、对齐并手动签名 APK
              run: |
                set -euo pipefail

                # 寻找工具路径
                ZIPALIGN=$(find "$ANDROID_HOME/build-tools" -name zipalign | sort -r | head -n 1)
                APKSIGNER=$(find "$ANDROID_HOME/build-tools" -name apksigner | sort -r | head -n 1)

                if [ -z "$ZIPALIGN" ] || [ -z "$APKSIGNER" ]; then
                  echo "zipalign/apksigner not found under $ANDROID_HOME/build-tools"
                  exit 1
                fi
                
                # 优先使用 unsigned APK，避免二次处理已签名包
                APK_DIR="src/mobile/android/app/build/outputs/apk/release"
                UNSIGNED_APK=""

                if [ -f "$APK_DIR/app-release-unsigned.apk" ]; then
                  UNSIGNED_APK="$APK_DIR/app-release-unsigned.apk"
                else
                  CANDIDATES=$(find "$APK_DIR" -name "*-unsigned.apk" | sort)
                  if [ -n "$CANDIDATES" ]; then
                    UNSIGNED_APK=$(printf '%s\n' "$CANDIDATES" | head -n 1)
                  fi
                fi

                if [ -z "$UNSIGNED_APK" ] || [ ! -f "$UNSIGNED_APK" ]; then
                  echo "Unsigned APK not found in $APK_DIR"
                  ls -R "$APK_DIR" || true
                  exit 1
                fi

                ALIGNED_APK="src/mobile/android/app/build/outputs/apk/release/app-aligned.apk"
                FINAL_APK="src/mobile/android/app/build/outputs/apk/release/app-release-signed.apk"
                
                echo "使用 APK: $UNSIGNED_APK"
                echo "1. 正在对齐 APK..."
                "$ZIPALIGN" -v -p 4 "$UNSIGNED_APK" "$ALIGNED_APK"
                
                echo "2. 正在使用 apksigner 进行 V2 签名..."
                "$APKSIGNER" sign --ks src/mobile/_signing/stapxs_qq.keystore \
                  --ks-pass pass:${{ secrets.KEYSTORE_PASSWORD }} \
                  --ks-key-alias stapxs_qq_key \
                  --key-pass pass:${{ secrets.KEYSTORE_ALIAS_PASSWORD }} \
                  --out "$FINAL_APK" "$ALIGNED_APK"
                
                echo "3. 验证签名..."
                "$APKSIGNER" verify --verbose "$FINAL_APK"

            - name: 准备产物
              run: |
                  set -euo pipefail
                  mkdir -p upload
                  VERSION=${{ inputs.version }}
                  # 优先取对齐后的已签名包
                  if [ -f src/mobile/android/app/build/outputs/apk/release/app-release-signed.apk ]; then
                    cp src/mobile/android/app/build/outputs/apk/release/app-release-signed.apk "upload/Stapxs.QQ.Lite-${VERSION}.apk"
                  else
                    cp src/mobile/android/app/build/outputs/apk/release/app-release.apk "upload/Stapxs.QQ.Lite-${VERSION}.apk" || \
                    cp src/mobile/android/app/build/outputs/apk/release/app-release-unsigned.apk "upload/Stapxs.QQ.Lite-${VERSION}-unsigned.apk"
                  fi
                  cp src/mobile/android/app/build/outputs/bundle/release/*.aab "upload/Stapxs.QQ.Lite-${VERSION}.aab" || true

            - name: 上传构建产物
              uses: actions/upload-artifact@v4
              with:
                  name: ${{ inputs.version }}-android
                  path: upload/
                  if-no-files-found: error
