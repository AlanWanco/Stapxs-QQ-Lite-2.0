name: 构建 Android

on:
    workflow_call:
        inputs:
            version:
                description: "应用版本"
                required: true
                type: string
        secrets:
            KEYSTORE_PASSWORD:
                required: false
            KEYSTORE_ALIAS_PASSWORD:
                required: false

jobs:
    build:
        runs-on: ubuntu-latest

        steps:
            - name: 拉取代码
              uses: actions/checkout@v4
              with:
                  submodules: recursive
            
            - name: 设置 Java 17
              uses: actions/setup-java@v4
              with:
                  distribution: 'temurin'
                  java-version: '17'
            
            - name: 启用 Corepack
              run: corepack enable
            
            - name: 设置 Nodejs
              uses: actions/setup-node@v4
              with:
                  node-version: 20.x
                  cache: 'yarn'
            
            - name: 更新依赖
              run: yarn
            
            - name: 构建 Android 应用
              run: yarn build:android
              env:
                  KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
                  KEYSTORE_ALIAS_PASSWORD: ${{ secrets.KEYSTORE_ALIAS_PASSWORD }}

            - name: 优化与对齐 APK (Zipalign)
              run: |
                # 寻找 zipalign 工具
                ZIPALIGN=$(find $ANDROID_HOME/build-tools -name zipalign | sort -r | head -n 1)
                APK_PATH="src/mobile/android/app/build/outputs/apk/release/app-release-signed.apk"
                if [ ! -f "$APK_PATH" ]; then
                  APK_PATH="src/mobile/android/app/build/outputs/apk/release/app-release.apk"
                fi
                
                if [ -f "$APK_PATH" ]; then
                  echo "对齐 APK: $APK_PATH"
                  $ZIPALIGN -p -v 4 "$APK_PATH" "src/mobile/android/app/build/outputs/apk/release/app-aligned.apk"
                  # 覆盖原文件以便后续重命名逻辑一致
                  mv "src/mobile/android/app/build/outputs/apk/release/app-aligned.apk" "$APK_PATH"
                else
                  echo "未找到 APK 文件进行对齐"
                fi

            - name: 准备产物
              run: |
                  mkdir -p upload
                  VERSION=${{ inputs.version }}
                  # 优先取对齐后的已签名包
                  if [ -f src/mobile/android/app/build/outputs/apk/release/app-release-signed.apk ]; then
                    cp src/mobile/android/app/build/outputs/apk/release/app-release-signed.apk "upload/Stapxs.QQ.Lite-${VERSION}.apk"
                  else
                    cp src/mobile/android/app/build/outputs/apk/release/app-release.apk "upload/Stapxs.QQ.Lite-${VERSION}.apk" || \
                    cp src/mobile/android/app/build/outputs/apk/release/app-release-unsigned.apk "upload/Stapxs.QQ.Lite-${VERSION}-unsigned.apk"
                  fi
                  cp src/mobile/android/app/build/outputs/bundle/release/*.aab "upload/Stapxs.QQ.Lite-${VERSION}.aab" || true

            - name: 上传构建产物
              uses: actions/upload-artifact@v4
              with:
                  name: ${{ inputs.version }}-android
                  path: upload/
